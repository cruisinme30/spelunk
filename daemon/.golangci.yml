# Strict golangci-lint v2 configuration. Run from daemon/: golangci-lint run ./...
# (npm run lint:go from the repo root). Every linter here is on in CI; a
# finding is fixed, or silenced on that one line with //nolint:<linter> and a
# reason (nolintlint rejects a bare //nolint).
version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0 # report everything, not the first 50
  max-same-issues: 0

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Bugs and correctness
    - asasalint # []any passed as ...any by mistake
    - bidichk # invisible Unicode direction marks
    - contextcheck # functions that drop the caller's context
    - copyloopvar
    - durationcheck # multiplying two durations
    - errchkjson # unchecked json.Marshal errors
    - errorlint # errors compared with == instead of errors.Is / As
    - exhaustive # switches over enums that miss a case
    - forcetypeassert # x.(T) without the ok check
    - gosec # security
    - makezero # append to a slice made with a length
    - nilerr # returning nil after checking err != nil
    - nilnesserr
    - nilnil # returning nil, nil
    - noctx # network and exec calls without a context
    - recvcheck # mixed value and pointer receivers
    - unparam # parameters that are always the same value
    - wastedassign
    # Readability and style
    - dupword # "the the"
    - errname # error types end in Error, sentinels start with Err
    - gocritic
    - godot # doc comments end with a period
    - intrange # for i := range n
    - misspell
    - nakedret
    - nolintlint # every //nolint names a linter and says why
    - perfsprint # fmt.Sprintf where a plain conversion reads better
    - predeclared # shadowing len, new, string...
    - revive # Go Code Review Comments
    - thelper # test helpers call t.Helper()
    - unconvert
    - usestdlibvars # http.MethodGet over "GET"
    - usetesting # t.TempDir, t.Context over os equivalents
    - whitespace
    # Size and complexity: long or deeply nested functions are hard to review
    - cyclop
    - funlen
    - gocognit
    - nestif
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    dupword:
      ignore: [primary] # the grammar in query/doc.go: "unary = [-] primary / primary = ..."
    exhaustive:
      default-signifies-exhaustive: true
    misspell:
      ignore-rules: [sinse] # the deliberate typo the "did you mean since:?" tests type
    govet:
      enable-all: true
      disable:
        - fieldalignment # reordering struct fields for padding hurts reading order
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # protocol structs are passed by value on purpose; they are small
        - unnamedResult # named results are reserved for when they document the result
    revive:
      severity: error
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: confusing-naming
        - name: confusing-results
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unhandled-error
          arguments: ["fmt.Print.*", "strings.Builder.Write.*", "bytes.Buffer.Write.*"]
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: use-any
        - name: useless-break
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict # skips files with a "Code generated ... DO NOT EDIT." header
    rules:
      # Table-driven tests are long by nature: one row per case.
      - path: _test\.go
        linters: [funlen, cyclop, gocognit, dupword]
      # Tests write fixtures to temp dirs, run git and ripgrep, and use a
      # seeded random corpus: none of that is a security boundary.
      - path: _test\.go
        linters: [gosec]
        text: "G(204|301|304|306|404)"
      # for _, tt := range tests copies each row; clearer than indexing.
      - path: _test\.go
        linters: [gocritic]
        text: rangeValCopy

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cruisinme30/unified-search
