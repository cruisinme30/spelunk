# Every push and pull request runs the whole suite: generated-code check,
# formatting, every linter, and all test layers (scripts/test-all.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install golangci-lint
        # The release download sometimes answers with a 5xx, so retry it.
        # scripts/presubmit.sh reads the version from the end of the curl line.
        run: |
          set -o pipefail
          for delay in 5 15 30 0; do
            if curl -sSfL --retry 3 https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
            then break; fi
            [ "$delay" = 0 ] && exit 1
            sleep "$delay"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for the webview tests
        run: npx playwright install --with-deps chromium

      - name: Lint and test
        run: npm test

  # The commands in a real VS Code window (scripts/e2e.mjs downloads it).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build the daemon and the extension
        run: |
          (cd daemon && go build -o bin/spelunk-daemon ./cmd/spelunk-daemon)
          npm run build

      - name: Run the end-to-end tests
        run: xvfb-run -a node scripts/e2e.mjs
