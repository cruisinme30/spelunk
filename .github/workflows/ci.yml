# Main and releases run the full suite. Feature PRs into develop run all
# static checks and behavioral layers selected by their dependency closure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call: # the release runs it before publishing

permissions:
  contents: read

concurrency:
  # Only active PR validation shares a group. Main/release runs and skipped
  # metadata events must not replace another run waiting in the concurrency queue.
  group: >-
    ci-${{ github.event_name == 'pull_request' && !github.event.pull_request.draft &&
           (github.event.action != 'edited' || github.event.changes.base != null) &&
           github.ref || github.run_id }}
  # A newer PR commit replaces its run; each main commit finishes its own.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        (github.event.action != 'edited' || github.event.changes.base != null) }}

jobs:
  test:
    # A skipped job is a successful check on GitHub. Give metadata-only events
    # a distinct name so they cannot supersede a failed test check on this SHA.
    name: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'edited' &&
          !github.event.changes.base && 'metadata-only-test' || 'test' }}
    # Drafts collect edits without CI churn. Retargeting a ready PR rechecks
    # it against its new destination; title/body-only edits do not rerun CI.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # compare the PR merge commit with the exact base SHA

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install golangci-lint
        # The release download sometimes answers with a 5xx, so retry it.
        # scripts/presubmit.sh reads the version from the end of the curl line.
        run: |
          set -o pipefail
          for delay in 5 15 30 0; do
            if curl -sSfL --retry 3 https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
            then break; fi
            [ "$delay" = 0 ] && exit 1
            sleep "$delay"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for the webview tests
        run: npx playwright install --with-deps chromium

      - name: Full quality and behavioral suite
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: npm test

      - name: Static quality and affected behavioral layers
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.sha }}
        run: scripts/test-changed.sh --base "$TEST_BASE_SHA" --head "$TEST_HEAD_SHA"

  # The commands in a real VS Code window (scripts/e2e.mjs downloads it).
  e2e:
    name: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'edited' &&
          !github.event.changes.base && 'metadata-only-e2e' || 'e2e' }}
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.base_ref == 'main' &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the daemon and the extension
        run: |
          (cd daemon && go build -o bin/spelunk-daemon ./cmd/spelunk-daemon)
          npm run build

      - name: Run the end-to-end tests
        run: xvfb-run -a node scripts/e2e.mjs
